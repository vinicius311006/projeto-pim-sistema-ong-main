# =====================================================================
# Docker Compose - Orquestração Web/API (.NET 10) + MySQL 8.0
# ONG Vestindo Sonhos (PIM IV - UNIP - Etapa 8: Cloud & DevOps)
# =====================================================================
services:
  db:
    image: mysql:8.0
    container_name: vestindosonhos-mysql
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: VESTINDOSONHOSDB
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./ScriptVestindoSonhos_MySQL.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  web-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vestindosonhos-app
    restart: unless-stopped
    ports:
      - "80:5000"
      - "5000:5000"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:5000
      - ConnectionStrings__DefaultConnection=${DEFAULT_CONNECTION_STRING}
    depends_on:
      db:
        condition: service_healthy

volumes:
  mysql_data:
