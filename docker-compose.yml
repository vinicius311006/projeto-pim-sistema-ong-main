version: '3.8'

# ==============================================================================
# PROJETO PIM - ONG VESTINDO SONHOS
# Orquestração de Containers Docker (Banco de Dados + API / Web + phpMyAdmin)
# Para rodar: docker compose up -d --build
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. Banco de Dados MySQL 8.0 com inicialização automática do Script SQL
  # ----------------------------------------------------------------------------
  db:
    image: mysql:8.0
    container_name: vestindosonhos_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: VESTINDOSONHOSDB
    ports:
      - "3306:3306"
    volumes:
      # Executa automaticamente o script com tabelas, views e dados iniciais no 1º boot
      - ./ScriptVestindoSonhos_MySQL.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------------------------
  # 2. Aplicação Web ASP.NET Core (.NET 10 MVC + REST API)
  # ----------------------------------------------------------------------------
  web:
    build:
      context: ./VestindoSonhos
      dockerfile: Dockerfile
    container_name: vestindosonhos_web
    restart: always
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Server=db;Port=3306;Database=VESTINDOSONHOSDB;User=root;Password=root;
    depends_on:
      db:
        condition: service_healthy

  # ----------------------------------------------------------------------------
  # 3. phpMyAdmin (Interface Web para gerenciar o Banco de Dados no navegador)
  # ----------------------------------------------------------------------------
  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: vestindosonhos_phpmyadmin
    restart: always
    ports:
      - "8080:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: root
    depends_on:
      - db

volumes:
  mysql_data:
